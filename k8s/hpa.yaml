apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: oficina-execution-service
  namespace: oficina-execution
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: oficina-execution-service }
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
