apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-execution-service
  namespace: oficina-execution
  labels:
    app.kubernetes.io/name: oficina-execution-service
    app.kubernetes.io/part-of: oficina
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: oficina-execution-service }
  template:
    metadata:
      labels:
        app: oficina-execution-service
        app.kubernetes.io/name: oficina-execution-service
        app.kubernetes.io/part-of: oficina
        tags.datadoghq.com/service: oficina-execution-service
        tags.datadoghq.com/env: hml
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: ghcr.io/maypinheiro/oficina-execution-service:latest
          imagePullPolicy: Always
          ports: [{ name: http, containerPort: 3000 }]
          env:
            - name: EXECUTION_TABLE_NAME
              valueFrom:
                configMapKeyRef: { name: oficina-execution-config, key: execution-table-name }
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef: { name: oficina-execution-config, key: aws-region }
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: { name: oficina-execution-aws-session, key: aws-access-key-id }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: oficina-execution-aws-session, key: aws-secret-access-key }
            - name: AWS_SESSION_TOKEN
              valueFrom:
                secretKeyRef: { name: oficina-execution-aws-session, key: aws-session-token }
            - name: COMMAND_QUEUE_URL
              valueFrom:
                configMapKeyRef: { name: oficina-execution-config, key: command-queue-url }
            - name: DOMAIN_EVENTS_TOPIC_ARN
              valueFrom:
                configMapKeyRef: { name: oficina-execution-config, key: domain-events-topic-arn }
            - name: DD_ENV
              valueFrom:
                configMapKeyRef: { name: oficina-execution-config, key: environment }
            - name: DD_SERVICE
              value: oficina-execution-service
            - name: DD_VERSION
              value: IMAGE_TAG
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef: { fieldPath: status.hostIP }
            - { name: DD_DOGSTATSD_PORT, value: "8125" }
            - { name: DD_TRACE_AGENT_PORT, value: "8126" }
            - { name: DD_LOGS_INJECTION, value: "true" }
            - { name: DD_RUNTIME_METRICS_ENABLED, value: "true" }
            - { name: DD_TRACE_PROPAGATION_STYLE_INJECT, value: "datadog,tracecontext" }
            - { name: DD_TRACE_PROPAGATION_STYLE_EXTRACT, value: "datadog,tracecontext" }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          startupProbe:
            httpGet: { path: /health, port: http }
            failureThreshold: 30
            periodSeconds: 2
          resources:
            requests: { cpu: 100m, memory: 128Mi, ephemeral-storage: 128Mi }
            limits: { cpu: 500m, memory: 512Mi, ephemeral-storage: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
